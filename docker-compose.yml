version: "3.9"

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: domain_flip_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domainflip}
      POSTGRES_USER: ${POSTGRES_USER:-domainflip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domainflip}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: domain_flip_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ─────────────────────────────────────────────────────

  # Parses ICANN zone files / calls WhoisXML API to discover expiring domains
  zone-parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain_flip_zone_parser
    restart: unless-stopped
    env_file: .env
    command: python -m app.zone_parser.runner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - zone_data:/data/zones

  # Multi-threaded monitor that tracks Redemption Period / Pending Delete status
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain_flip_monitor
    restart: unless-stopped
    env_file: .env
    command: python -m app.monitor.runner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Executes register calls the moment a domain drops (Dynadot / Namejet)
  sniper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain_flip_sniper
    restart: unless-stopped
    env_file: .env
    command: python -m app.sniper.runner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional: lightweight web dashboard / REST API for inspection
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain_flip_api
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  zone_data:
